schema_version = 1
profile_name = "espeak"

[permissions]
arbitrary_text = true
arbitrary_local_audio = false

[playback]
minimum_gain = 0.0
maximum_gain = 0.7
default_gain = 0.4
default_concurrency = "enqueue"
allowed_concurrency = ["enqueue", "interrupt"]
maximum_queue_items = 16
maximum_mix_streams = 2
maximum_audio_seconds = 0

[outputs]
default_target = "system"

[[outputs.targets]]
id = "system"
description = "Current system default audio device"
kind = "system_default"
allow = ["audio", "speech"]

[tts]
enabled = true
provider = "utterpipe-espeak-ng"
maximum_characters = 300
agent_utterance_options = ["voice", "rate_wpm", "pitch"]

[tts.utterance_options]
voice = "default"
rate_wpm = 175
pitch = 50
amplitude = 100

[logging]
level = "warning"
history_enabled = false
history_include_spoken_text = false
