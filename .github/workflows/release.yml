name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out release tag and engine source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_id="$(cargo pkgid --locked -p utterpipe-espeak-ng)"
          package_version="${package_id##*#}"
          package_version="${package_version##*@}"
          expected_tag="v$package_version"
          test "$GITHUB_REF_NAME" = "$expected_tag" || {
            echo "release tag '$GITHUB_REF_NAME' must equal '$expected_tag'" >&2
            exit 1
          }
          echo "ARCHIVE_NAME=utterpipe-espeak-ng-$expected_tag-$TARGET" >> "$GITHUB_ENV"

      - name: Test and build release
        run: |
          cargo test --locked --release --all-targets --target "$TARGET"
          cargo build --locked --release --target "$TARGET"

      - name: Package self-contained executable
        shell: bash
        run: |
          package_root="$RUNNER_TEMP/$ARCHIVE_NAME"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$package_root" "$dist"
          cp "target/$TARGET/release/utterpipe-espeak-ng" "$package_root/"
          cp README.md SPEC.md THIRD_PARTY.md LICENSE "$package_root/"

          archive="$dist/$ARCHIVE_NAME.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$ARCHIVE_NAME"
          hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s *%s\n' "$hash" "$(basename "$archive")" > "$archive.sha256"

          extract_root="$RUNNER_TEMP/package-check"
          mkdir -p "$extract_root"
          tar -C "$extract_root" -xzf "$archive"
          "$extract_root/$ARCHIVE_NAME/utterpipe-espeak-ng" doctor

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out release tag and engine source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq "utterpipe-espeak-ng"
          if ($null -eq $package) { throw "utterpipe-espeak-ng package was not found" }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "release tag '$env:GITHUB_REF_NAME' must equal '$expectedTag'"
          }
          "ARCHIVE_NAME=utterpipe-espeak-ng-$expectedTag-$env:TARGET" >> $env:GITHUB_ENV

      - name: Test and build release
        run: |
          cargo test --locked --release --all-targets --target $env:TARGET
          cargo build --locked --release --target $env:TARGET

      - name: Package self-contained executable
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_NAME
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $packageRoot, $dist | Out-Null
          Copy-Item "target/$env:TARGET/release/utterpipe-espeak-ng.exe" $packageRoot
          Copy-Item "README.md", "SPEC.md", "THIRD_PARTY.md", "LICENSE" $packageRoot

          $archive = Join-Path $dist "$env:ARCHIVE_NAME.zip"
          Compress-Archive -Path $packageRoot -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$([System.IO.Path]::GetFileName($archive))" |
            Set-Content "$archive.sha256" -Encoding ascii

          $extractRoot = Join-Path $env:RUNNER_TEMP "package-check"
          Expand-Archive $archive -DestinationPath $extractRoot
          & "$extractRoot/$env:ARCHIVE_NAME/utterpipe-espeak-ng.exe" doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error

  source:
    name: Corresponding source
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag and engine source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Package initialized source tree
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          archive_name="utterpipe-espeak-ng-$version-source"
          mkdir -p dist
          tar --exclude-vcs --exclude=target --exclude=dist \
            --transform "s,^,$archive_name/," \
            -czf "dist/$archive_name.tar.gz" .
          hash="$(sha256sum "dist/$archive_name.tar.gz" | awk '{print $1}')"
          printf '%s *%s\n' "$hash" "$archive_name.tar.gz" > "dist/$archive_name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [unix, windows, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "UtterPipe eSpeak NG $GITHUB_REF_NAME"
