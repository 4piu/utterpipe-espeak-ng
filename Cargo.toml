[package]
name = "utterpipe-espeak-ng"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Offline UtterPipe text-to-speech (TTS) provider with bundled eSpeak NG voices"
repository = "https://github.com/4piu/utterpipe-espeak-ng"
homepage = "https://github.com/4piu/utterpipe-espeak-ng"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
espeak-ng-data-dict-ru = "=0.1.0"
espeak-ng-data-dicts = "=0.1.0"
espeak-ng-data-phonemes = "=0.1.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "warn"
